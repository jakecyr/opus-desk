name: Bug report
description: Report a reproducible problem in Opus Desk.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private conversations, or sensitive repository data. Report security vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Opus Desk version
      description: Output of opus-desk --version, or the source commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, browser, installation method, and relevant gh/Codex/Claude CLI versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact usernames, tokens, file paths, and private content as needed.
